services:
  api:
    build:
      context: .
    image: contexthub:local
    init: true
    environment:
      CONTEXTHUB_ENVIRONMENT: docker
      CONTEXTHUB_ALLOW_START_WITHOUT_INDEX: "false"
      CONTEXTHUB_HUGGINGFACE_MODEL: ${CONTEXTHUB_HUGGINGFACE_MODEL:?Set CONTEXTHUB_HUGGINGFACE_MODEL in .env}
      CONTEXTHUB_HUGGINGFACE_API_TOKEN: ${CONTEXTHUB_HUGGINGFACE_API_TOKEN:?Set CONTEXTHUB_HUGGINGFACE_API_TOKEN in .env}
    volumes:
      - huggingface-cache:/home/contexthub/.cache/huggingface
    ports:
      - "${CONTEXTHUB_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3

  ui:
    image: contexthub:local
    init: true
    command:
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"
    environment:
      CONTEXTHUB_API_BASE_URL: http://api:8000
    ports:
      - "${CONTEXTHUB_UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  huggingface-cache:
