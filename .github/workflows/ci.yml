name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Quality, tests, and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.6"
          tofu_wrapper: false

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run Ruff lint checks
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy src

      - name: Run tests
        run: uv run pytest

      - name: Check OpenTofu formatting
        run: tofu -chdir=terraform fmt -check

      - name: Validate OpenTofu configuration
        run: |
          tofu -chdir=terraform init -backend=false -input=false
          tofu -chdir=terraform validate

      - name: Build Docker image
        run: docker build --tag contexthub:ci .
