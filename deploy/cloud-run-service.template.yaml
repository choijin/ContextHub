apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: contexthub
  annotations:
    run.googleapis.com/iap-enabled: "true"
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/container-dependencies: '{"frontend":["api"]}'
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/secrets: contexthub-hf-token:projects/${PROJECT_NUMBER}/secrets/contexthub-huggingface-api-token
        run.googleapis.com/sessionAffinity: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 10
      serviceAccountName: contexthub-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      timeoutSeconds: 3600
      containers:
        - name: frontend
          image: &contexthub_image ${IMAGE_URL}
          command:
            - streamlit
          args:
            - run
            - frontend/streamlit_app.py
            - --server.address
            - 0.0.0.0
            - --server.port
            - "8080"
            - --server.headless
            - "true"
          env:
            - name: CONTEXTHUB_API_BASE_URL
              value: http://api:8000
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 12

        - name: api
          image: *contexthub_image
          command:
            - uvicorn
          args:
            - contexthub.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - name: CONTEXTHUB_ENVIRONMENT
              value: cloud-run
            - name: CONTEXTHUB_ALLOW_START_WITHOUT_INDEX
              value: "false"
            - name: CONTEXTHUB_HUGGINGFACE_MODEL
              value: ${HUGGINGFACE_MODEL}
            - name: CONTEXTHUB_HUGGINGFACE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: contexthub-hf-token
                  key: "1"
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 30
